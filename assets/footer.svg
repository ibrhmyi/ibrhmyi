<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="1200" height="130">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1" fill="#1c1c1c"/>
    </pattern>
  </defs>
  <style>
    @keyframes blink { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }
    .cursor { animation: blink 1.1s step-end infinite }
    @keyframes spin { to { transform: rotate(360deg); } }
    .orbit { transform-origin: center; transform-box: fill-box; animation: spin 14s linear infinite; }
  </style>
  <rect width="1200" height="130" fill="#0a0a0a"/>
  <rect width="1200" height="130" fill="url(#dots)"/>
  <line x1="64" y1="40" x2="1136" y2="40" stroke="#2a2a2a" stroke-width="1"/>
  <g class="orbit">
    <rect x="596" y="80" width="8" height="8" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
  </g>
  <rect x="612" y="81" width="7" height="13" fill="#f5f5f5" class="cursor"/>
  <text x="64" y="112" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#3d3d3d" letter-spacing="3">IBRAHIM YILDIZ &#183; SAN FRANCISCO &#183; EOF</text>
  <text x="1136" y="112" text-anchor="end" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#3d3d3d" letter-spacing="3">DESIGNED IN MONO</text>
</svg>
